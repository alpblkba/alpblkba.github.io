<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Reflog recovery</title>
  <desc id="svg-desc">A commit becomes unreferenced after main resets. HEAD reflog entries preserve its previous location, allowing a recovery branch to restore it.</desc>
  <metadata>How Git Could Have Saved My Friendship — figure 08</metadata>

    <style>
    /* Figure stylesheet. These SVGs are loaded as standalone images, so nothing here
       can come from the page — the whole visual contract lives in this block.
       Order matters: sizes first, colour modifiers last. */
    #canvas { fill: #070C0B; }
    text {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
        "Helvetica Neue", Arial, sans-serif;
      fill: #A8E8DC;
    }
    .mono {
      font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo,
        "DejaVu Sans Mono", Consolas, monospace;
    }
    .eyebrow  { font-size: 13px; font-weight: 500; letter-spacing: 2.6px; fill: #3E8C80; }
    .title    { font-size: 30px; font-weight: 700; letter-spacing: -0.2px; fill: #EAFFFA; }
    .subtitle { font-size: 15px; fill: #7ACEC3; }
    .section  { font-size: 17px; font-weight: 700; fill: #D6FFF8; }
    .label    { font-size: 15px; font-weight: 500; fill: #C8F7EE; }
    .body     { font-size: 15px; fill: #A8E8DC; }
    .small    { font-size: 13px; fill: #7ACEC3; }
    .tiny     { font-size: 11px; letter-spacing: 0.6px; fill: #6FBFB4; }
    .hash     { font-size: 13px; letter-spacing: 0.5px; }

    /* strokes */
    .rule      { stroke: #17332F; stroke-width: 1.5; }
    .line      { fill: none; stroke: #2E5A54; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line-dark { fill: none; stroke: #47857C; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .line-blue { fill: none; stroke: #00F5D4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash      { stroke-dasharray: 7 6; }

    /* solids */
    .dot          { fill: #12211F; stroke: #47857C; stroke-width: 2; }
    .dot-blue     { fill: #06312B; stroke: #00F5D4; stroke-width: 2.5; }
    .object       { fill: #101B19; stroke: #2E5A54; stroke-width: 1.5; }
    .object-blue  { fill: rgba(0, 245, 212, 0.1); stroke: #00F5D4; stroke-width: 1.5; }
    .object-dark  { fill: #0A1211; stroke: #3E6B65; stroke-width: 1.5; }
    .panel        { fill: #0A100F; stroke: #1C3A35; stroke-width: 1.5; }
    .command-chip { fill: rgba(0, 245, 212, 0.09); stroke: #1E5B52; stroke-width: 1.5; }
    .blue-fill    { fill: #00F5D4; stroke: none; }
    .soft-fill    { fill: #101B19; stroke: #1C3A35; stroke-width: 1.5; }

    /* colour modifiers — always last */
    .muted      { fill: #4E7C76; }
    .blue-text  { fill: #00F5D4; }
    .white-text { fill: #04120F; }
    .dot.muted  { fill: #0C1413; stroke: #2A4B46; }
    .line.muted { fill: none; stroke: #2A4B46; }
  </style><defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#4E7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    
  </defs>
  <rect id="canvas" width="1200" height="800" fill="#070C0B"></rect>

  <g id="figure-header">
    <text class="eyebrow" x="64" y="48">GIT SYSTEM / 08</text>
    <text class="title" x="64" y="88">Reflog recovery</text>
    <text class="subtitle" x="64" y="116">Branch names can move away from a commit; the reflog still records where HEAD used to be.</text>
    <line class="rule" x1="64" y1="144" x2="1136" y2="144"></line>
  </g>

  <g id="reflog-recovery-story">
    
    <g id="post-reset-history">
      <text class="eyebrow" x="88" y="208">COMMIT GRAPH</text>
      <path class="line-dark" d="M159 312 L329 312 M359 312 L529 312"></path>
      <g><circle class="dot" cx="144" cy="312" r="15"></circle><text class="label" x="144" y="317" text-anchor="middle">A</text></g>
      <g><circle class="dot-blue" cx="344" cy="312" r="15"></circle><text class="label blue-text" x="344" y="317" text-anchor="middle">B</text></g>
      <g id="lost-commit">
        <circle class="dot" cx="544" cy="312" r="15" stroke-dasharray="4 4"></circle>
        <text class="label muted" x="544" y="317" text-anchor="middle">C</text>
        <circle class="line dash" cx="544" cy="312" r="32"></circle>
        <text class="tiny" x="544" y="374" text-anchor="middle">unreferenced · 71c9</text>
      </g>
      <g id="main-after-reset">
        <rect class="object-blue" x="284" y="224" width="120" height="40" rx="8"></rect>
        <text class="mono tiny blue-text" x="344" y="249" text-anchor="middle">main</text>
        <path class="line-blue" d="M344 264 L344 292" marker-end="url(#arrow-blue)"></path>
      </g>
      <text class="small" x="144" y="416">main moved backward; C lost its branch name.</text>
    </g>

    
    <g id="recovery-branch">
      <rect class="command-chip" x="760" y="240" width="344" height="48" rx="8"></rect>
      <text class="mono body blue-text" x="932" y="270" text-anchor="middle">git branch recovery HEAD@{1}</text>
      <rect class="object-blue" x="844" y="328" width="176" height="48" rx="8"></rect>
      <text class="mono body blue-text" x="932" y="358" text-anchor="middle">recovery → 71c9</text>
      <path class="line-blue" d="M828 352 C736 352 688 312 578 312" marker-end="url(#arrow-blue)"></path>
      <text class="eyebrow" x="932" y="416" text-anchor="middle">RECOVERED</text>
    </g>

    
    <g id="reflog-timeline">
      <text class="eyebrow" x="88" y="496">HEAD REFLOG</text>
      <path class="line" d="M144 552 L984 552"></path>

      <g id="reflog-entry-3">
        <circle class="dot" cx="144" cy="552" r="10"></circle>
        <text class="mono label" x="144" y="592" text-anchor="middle">HEAD@{3}</text>
        <text class="small" x="144" y="616" text-anchor="middle">A · 0ac2</text>
      </g>
      <g id="reflog-entry-2">
        <circle class="dot" cx="424" cy="552" r="10"></circle>
        <text class="mono label" x="424" y="592" text-anchor="middle">HEAD@{2}</text>
        <text class="small" x="424" y="616" text-anchor="middle">B · 5be1</text>
      </g>
      <g id="reflog-entry-1">
        <circle class="dot-blue" cx="704" cy="552" r="10"></circle>
        <text class="mono label blue-text" x="704" y="592" text-anchor="middle">HEAD@{1}</text>
        <text class="small blue-text" x="704" y="616" text-anchor="middle">C · 71c9</text>
        <path class="line-blue dash" d="M704 540 C704 464 624 416 560 346" marker-end="url(#arrow-blue)"></path>
      </g>
      <g id="reflog-entry-0">
        <circle class="dot" cx="984" cy="552" r="10"></circle>
        <text class="mono label" x="984" y="592" text-anchor="middle">HEAD@{0}</text>
        <text class="small" x="984" y="616" text-anchor="middle">B · reset</text>
      </g>
      <text class="tiny" x="144" y="664">OLDER</text>
      <text class="tiny" x="984" y="664" text-anchor="end">NOW</text>
    </g>

    <text class="section" x="600" y="736" text-anchor="middle">Nothing is truly lost immediately: first recover the name.</text>
  </g>
</svg>