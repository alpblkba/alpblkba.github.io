name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the generator. Bump both together; the checksum is the release asset's.
  ZOLA_VERSION: 0.23.4
  ZOLA_SHA256: 54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install zola
        run: |
          set -euo pipefail
          tarball="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${tarball}"
          echo "${ZOLA_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" zola
          install -m 0755 zola /usr/local/bin/zola
          zola --version

      - name: build site
        run: zola build

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4
