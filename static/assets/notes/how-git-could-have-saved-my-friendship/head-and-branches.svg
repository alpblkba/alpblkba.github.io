<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">HEAD and branches</title>
  <desc id="svg-desc">Commits A through E form a history. Main, feature login, and feature auth point to commits. HEAD moves from main to feature auth.</desc>
  <metadata>How Git Could Have Saved My Friendship — figure 03</metadata>

    <style>
    /* Figure stylesheet. These SVGs are loaded as standalone images, so nothing here
       can come from the page — the whole visual contract lives in this block.
       Order matters: sizes first, colour modifiers last. */
    #canvas { fill: #070C0B; }
    text {
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
        "Helvetica Neue", Arial, sans-serif;
      fill: #A8E8DC;
    }
    .mono {
      font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo,
        "DejaVu Sans Mono", Consolas, monospace;
    }
    .eyebrow  { font-size: 13px; font-weight: 500; letter-spacing: 2.6px; fill: #3E8C80; }
    .title    { font-size: 30px; font-weight: 700; letter-spacing: -0.2px; fill: #EAFFFA; }
    .subtitle { font-size: 15px; fill: #7ACEC3; }
    .section  { font-size: 17px; font-weight: 700; fill: #D6FFF8; }
    .label    { font-size: 15px; font-weight: 500; fill: #C8F7EE; }
    .body     { font-size: 15px; fill: #A8E8DC; }
    .small    { font-size: 13px; fill: #7ACEC3; }
    .tiny     { font-size: 11px; letter-spacing: 0.6px; fill: #6FBFB4; }
    .hash     { font-size: 13px; letter-spacing: 0.5px; }

    /* strokes */
    .rule      { stroke: #17332F; stroke-width: 1.5; }
    .line      { fill: none; stroke: #2E5A54; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .line-dark { fill: none; stroke: #47857C; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .line-blue { fill: none; stroke: #00F5D4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dash      { stroke-dasharray: 7 6; }

    /* solids */
    .dot          { fill: #12211F; stroke: #47857C; stroke-width: 2; }
    .dot-blue     { fill: #06312B; stroke: #00F5D4; stroke-width: 2.5; }
    .object       { fill: #101B19; stroke: #2E5A54; stroke-width: 1.5; }
    .object-blue  { fill: rgba(0, 245, 212, 0.1); stroke: #00F5D4; stroke-width: 1.5; }
    .object-dark  { fill: #0A1211; stroke: #3E6B65; stroke-width: 1.5; }
    .panel        { fill: #0A100F; stroke: #1C3A35; stroke-width: 1.5; }
    .command-chip { fill: rgba(0, 245, 212, 0.09); stroke: #1E5B52; stroke-width: 1.5; }
    .blue-fill    { fill: #00F5D4; stroke: none; }
    .soft-fill    { fill: #101B19; stroke: #1C3A35; stroke-width: 1.5; }

    /* colour modifiers — always last */
    .muted      { fill: #4E7C76; }
    .blue-text  { fill: #00F5D4; }
    .white-text { fill: #04120F; }
    .dot.muted  { fill: #0C1413; stroke: #2A4B46; }
    .line.muted { fill: none; stroke: #2A4B46; }
  </style><defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#00F5D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#4E7C76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    
  </defs>
  <rect id="canvas" width="1200" height="800" fill="#070C0B"></rect>

  <g id="figure-header">
    <text class="eyebrow" x="64" y="48">GIT SYSTEM / 03</text>
    <text class="title" x="64" y="88">HEAD and branches</text>
    <text class="subtitle" x="64" y="116">Branches are movable names; HEAD identifies the branch currently receiving commits.</text>
    <line class="rule" x1="64" y1="144" x2="1136" y2="144"></line>
  </g>

  
  <g id="commit-history">
    <path class="line-dark" d="M151 410 L313 410 M343 410 L505 410 M535 410 L697 410 M727 410 L889 410"></path>
    <g><circle class="dot" cx="136" cy="410" r="15"></circle><text class="label" x="136" y="415" text-anchor="middle">A</text></g>
    <g><circle class="dot" cx="328" cy="410" r="15"></circle><text class="label" x="328" y="415" text-anchor="middle">B</text></g>
    <g><circle class="dot" cx="520" cy="410" r="15"></circle><text class="label" x="520" y="415" text-anchor="middle">C</text></g>
    <g><circle class="dot-blue" cx="712" cy="410" r="15"></circle><text class="label blue-text" x="712" y="415" text-anchor="middle">D</text></g>
    <g><circle class="dot" cx="904" cy="410" r="15"></circle><text class="label" x="904" y="415" text-anchor="middle">E</text></g>
    <text class="tiny" x="136" y="452" text-anchor="middle">oldest</text>
    <text class="tiny" x="904" y="452" text-anchor="middle">newest</text>
  </g>

  <g id="branch-pointers">
    <g id="feature-login-pointer">
      <path class="line" d="M520 428 L520 514"></path>
      <rect class="object" x="444" y="516" width="152" height="48" rx="8"></rect>
      <text class="mono body" x="520" y="546" text-anchor="middle">feature/login</text>
    </g>
    <g id="feature-auth-pointer">
      <rect class="object-blue" x="632" y="264" width="160" height="48" rx="8"></rect>
      <text class="mono body blue-text" x="712" y="294" text-anchor="middle">feature/auth</text>
      <path class="line-blue" d="M712 312 L712 390" marker-end="url(#arrow-blue)"></path>
    </g>
    <g id="main-pointer">
      <path class="line" d="M904 428 L904 514"></path>
      <rect class="object" x="844" y="516" width="120" height="48" rx="8"></rect>
      <text class="mono body" x="904" y="546" text-anchor="middle">main</text>
    </g>
  </g>

  <g id="head-pointer">
    <g id="head-before">
      <text class="tiny" x="904" y="180" text-anchor="middle">BEFORE</text>
      <rect class="object" x="844" y="192" width="120" height="48" rx="8"></rect>
      <text class="mono label muted" x="904" y="222" text-anchor="middle">HEAD</text>
      <path class="line dash" d="M904 240 L904 506"></path>
    </g>
    <path class="line-blue dash" d="M836 216 C800 176 760 176 732 216" marker-end="url(#arrow-blue)"></path>
    <text class="mono tiny blue-text" x="784" y="170" text-anchor="middle">git switch feature/auth</text>
    <g id="head-after">
      <text class="tiny blue-text" x="712" y="180" text-anchor="middle">NOW</text>
      <rect class="blue-fill" x="652" y="192" width="120" height="48" rx="8"></rect>
      <text class="mono label white-text" x="712" y="222" text-anchor="middle">HEAD</text>
      <path class="line-blue" d="M712 240 L712 256" marker-end="url(#arrow-blue)"></path>
    </g>
  </g>

  <g id="head-lesson">
    <line class="rule" x1="176" y1="648" x2="1024" y2="648"></line>
    <text class="section" x="600" y="688" text-anchor="middle">Switching moves HEAD between branch names. The commit graph stays put.</text>
  </g>
</svg>