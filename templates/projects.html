{# projects.astro #}
{% extends "base.html" %}
{% block title %}projects — alpblkba.dev{% endblock title %}
{% block content %}
{% for g in config.extra.project_groups %}
{% <ui.section title={g.title}> %}
    {% for p in g.items %}{{<ui.project_row kicker={p.kicker} name={p.name} tags={p.tags} text={p.body} href={p.href} />}}
    {% endfor %}
{% </ui.section> %}
{% endfor %}
{% endblock content %}
