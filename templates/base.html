{# BaseLayout.astro #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}alpblkba.dev{% endblock title %}</title>
    <meta name="description" content="{{ config.description }}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}" />
    <link rel="stylesheet" href="/styles/site.css" />
{% block head %}{% endblock head %}  </head>
  <body{% block body_class %}{% endblock body_class %}>
    <div class="shell">
      <img class="plate" src="/images/bg.jpg" alt="" aria-hidden="true" />
      <div class="plate-scrim"></div>
      <div class="col">
        {% include "partials/header.html" %}
        <hr class="rule rule--divider rule--inset" />
        <div class="section-pad">
{% block content %}{% endblock content %}
        </div>
        {% include "partials/footer.html" %}
      </div>
    </div>
    {% include "partials/palette.html" %}
  </body>
</html>
