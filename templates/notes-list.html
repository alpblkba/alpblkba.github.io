{# notes.astro #}
{% extends "base.html" %}
{% block title %}notes{% endblock title %}
{% block content %}
{% <ui.section title="Notes"> %}
    <ul class="rows">
      {% for n in section.pages %}{{<ui.note_row date={n.extra.display_date} title={n.extra.list_title} tag={n.extra.tag} href={"/notes/" ~ n.slug} />}}
      {% endfor %}
    </ul>
{% </ui.section> %}
{% endblock content %}
